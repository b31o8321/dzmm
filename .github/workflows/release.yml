name: Build release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macos-arm64
            artifact_glob: 'frontend/src-tauri/target/release/bundle/dmg/*.dmg'
          - os: windows-latest
            label: windows-x64
            artifact_glob: 'frontend/src-tauri/target/release/bundle/nsis/*.exe'

    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.label }})

    steps:
      - uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend/src-tauri/target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}

      - name: backend venv + deps
        working-directory: backend
        shell: bash
        run: |
          python -m venv .venv
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ./.venv/Scripts/python -m pip install --upgrade pip
            ./.venv/Scripts/python -m pip install -e ".[dev]"
          else
            ./.venv/bin/python -m pip install --upgrade pip
            ./.venv/bin/python -m pip install -e ".[dev]"
          fi

      - name: backend tests
        working-directory: backend
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PYTHONPATH=src ./.venv/Scripts/python -m pytest -q
          else
            PYTHONPATH=src ./.venv/bin/python -m pytest -q
          fi

      - name: build sidecar
        working-directory: backend
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ./.venv/Scripts/python build_sidecar.py
          else
            ./.venv/bin/python build_sidecar.py
          fi

      - name: install frontend deps
        working-directory: frontend
        run: npm ci || npm install

      - name: tauri build
        working-directory: frontend
        run: npm run tauri:build

      - name: smoke artifact (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          DMG=$(find frontend/src-tauri/target/release/bundle/dmg -name '*.dmg' | head -1)
          if [ -z "$DMG" ]; then
            echo "::error::no .dmg found"
            exit 1
          fi
          SIZE=$(stat -f %z "$DMG")
          echo "DMG size: $SIZE bytes"
          if [ "$SIZE" -lt 20971520 ]; then  # 20MB
            echo "::error::DMG too small ($SIZE < 20MB), likely missing backend bundle"
            exit 1
          fi

          MOUNTPOINT=$(mktemp -d)
          hdiutil attach "$DMG" -mountpoint "$MOUNTPOINT" -nobrowse -readonly
          trap "hdiutil detach \"$MOUNTPOINT\" -force || true" EXIT

          APP=$(find "$MOUNTPOINT" -maxdepth 2 -name 'dzmm.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "::error::dzmm.app missing from DMG"
            exit 1
          fi

          if [ ! -f "$APP/Contents/MacOS/dzmm" ] && [ ! -f "$APP/Contents/MacOS/app" ]; then
            echo "::error::main binary missing in dzmm.app/Contents/MacOS"
            ls -la "$APP/Contents/MacOS/" || true
            exit 1
          fi

          BACKEND=$(find "$APP/Contents/Resources" -name 'dzmm-backend' -type f | head -1)
          if [ -z "$BACKEND" ]; then
            echo "::error::dzmm-backend missing from .app resources"
            ls -la "$APP/Contents/Resources/" | head -20
            exit 1
          fi

          INTERNAL=$(find "$APP/Contents/Resources" -name '_internal' -type d | head -1)
          if [ -z "$INTERNAL" ]; then
            echo "::error::PyInstaller _internal dir missing — onedir bundle broken"
            exit 1
          fi

          echo "::notice::DMG smoke OK: $SIZE bytes, .app + backend + _internal all present"

      - name: smoke artifact (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          EXE=$(find frontend/src-tauri/target/release/bundle/nsis -name '*-setup.exe' | head -1)
          if [ -z "$EXE" ]; then
            echo "::error::no NSIS .exe found"
            exit 1
          fi
          SIZE=$(stat -c %s "$EXE")
          echo "EXE size: $SIZE bytes"
          if [ "$SIZE" -lt 15728640 ]; then  # 15MB
            echo "::error::EXE too small ($SIZE < 15MB)"
            exit 1
          fi

          # NSIS 安装包是 7z 自解压档（用 7z 列出内容）
          7z l "$EXE" > /tmp/nsis_contents.txt 2>&1 || true
          echo "::group::NSIS contents (excerpt)"
          head -100 /tmp/nsis_contents.txt
          echo "::endgroup::"

          if ! grep -q 'dzmm-backend.exe' /tmp/nsis_contents.txt; then
            echo "::error::dzmm-backend.exe not found in NSIS installer"
            exit 1
          fi

          if ! grep -qi 'python313.dll\|_internal' /tmp/nsis_contents.txt; then
            echo "::error::Python runtime files missing from installer (no python*.dll or _internal)"
            exit 1
          fi

          echo "::notice::EXE smoke OK: $SIZE bytes, dzmm-backend.exe + Python runtime present"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dzmm-${{ matrix.label }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: collect artifacts
        run: |
          mkdir -p release
          find dist -type f \( -name '*.dmg' -o -name '*.exe' \) -exec cp {} release/ \;
          ls -la release/
      - name: generate latest.json
        run: |
          set -e
          VERSION="${GITHUB_REF#refs/tags/}"
          # 收集 .dmg 和 .exe 路径
          DMG=$(find release -name '*.dmg' | head -1)
          EXE=$(find release -name '*.exe' | head -1)

          cat > release/latest.json <<EOF
          {
            "version": "$VERSION",
            "notes": "见 https://github.com/${GITHUB_REPOSITORY}/releases/tag/${VERSION}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "",
                "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/$(basename "$DMG")"
              },
              "windows-x86_64": {
                "signature": "",
                "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/$(basename "$EXE")"
              }
            }
          }
          EOF
          cat release/latest.json
      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: false
          prerelease: false
