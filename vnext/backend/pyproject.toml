[project]
name = "dzmm-next-backend"
version = "0.1.0"
description = "Clean-slate backend for DZMM Next Preview"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14",
    "aiosqlite>=0.19",
    "fastapi>=0.110",
    "jsonschema>=4.23",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dzmm_vnext"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
