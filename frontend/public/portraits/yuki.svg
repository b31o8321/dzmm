<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- 御坂雪: Taisho-era university student, navy hakama, ofuda charm -->
  <defs>
    <radialGradient id="bgYuki" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#3a4a5c"/>
      <stop offset="60%" stop-color="#1f2733"/>
      <stop offset="100%" stop-color="#0d1118"/>
    </radialGradient>
    <linearGradient id="hakama" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#243248"/>
      <stop offset="100%" stop-color="#101830"/>
    </linearGradient>
    <linearGradient id="kimono" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff6f0"/>
      <stop offset="100%" stop-color="#e8dccf"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" fill="url(#bgYuki)"/>

  <!-- Subtle paper-lantern glow in background -->
  <circle cx="40" cy="200" r="20" fill="#ffaa55" opacity="0.18"/>
  <circle cx="216" cy="200" r="20" fill="#ffaa55" opacity="0.18"/>

  <!-- Hakama (skirt portion) -->
  <path d="M 70 256 L 78 175 Q 128 158 178 175 L 186 256 Z" fill="url(#hakama)"/>

  <!-- White kimono top -->
  <path d="M 78 175 Q 88 130 128 125 Q 168 130 178 175 L 168 175 Q 128 145 88 175 Z" fill="url(#kimono)"/>

  <!-- Obi (sash) -->
  <rect x="78" y="170" width="100" height="10" fill="#8b1e3f"/>

  <!-- Neck / face -->
  <ellipse cx="128" cy="105" rx="22" ry="28" fill="#f5e0d0"/>

  <!-- Hair (shoulder length, black) -->
  <path d="M 102 90 Q 100 75 110 65 Q 128 50 146 65 Q 156 75 154 90 L 154 130 Q 144 138 128 138 Q 112 138 102 130 Z" fill="#1a1418"/>
  <path d="M 102 90 Q 95 100 90 130 L 100 132 L 102 105 Z" fill="#1a1418"/>
  <path d="M 154 90 Q 161 100 166 130 L 156 132 L 154 105 Z" fill="#1a1418"/>

  <!-- Eyes (closed/calm) -->
  <path d="M 116 108 Q 120 110 124 108" stroke="#2a1420" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 132 108 Q 136 110 140 108" stroke="#2a1420" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Subtle blush -->
  <ellipse cx="118" cy="118" rx="4" ry="2" fill="#f0a090" opacity="0.5"/>
  <ellipse cx="138" cy="118" rx="4" ry="2" fill="#f0a090" opacity="0.5"/>

  <!-- Mouth -->
  <path d="M 124 124 Q 128 126 132 124" stroke="#a04050" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- Ofuda charm hanging at chest -->
  <rect x="123" y="155" width="10" height="14" fill="#fff6f0" stroke="#8b1e3f" stroke-width="0.6"/>
  <text x="128" y="166" font-size="6" fill="#8b1e3f" text-anchor="middle" font-family="serif">念</text>
</svg>
