[project]
name = "dzmm"
version = "0.15.0"
description = "AI dynamic TRPG text game backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.19",
    "httpx>=0.27",
    "pydantic>=2.6",
    "keyring>=24.0",
    "sse-starlette>=2.0",
    "python-multipart>=0.0.9",
    "langchain-text-splitters>=0.3",
    "langchain-core>=0.3",
    "chromadb>=0.5",
    "langgraph>=0.2",
    "edge-tts>=6.1",
    "kokoro-onnx>=0.4",
    "soundfile>=0.12",
    "zeroconf>=0.132",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.3",
    "pyinstaller>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dzmm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
