<!doctype html>
<html lang="zh-CN" data-theme="fog">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DZMM Next · 设置与联动工作台</title>
  <style>
    :root { --canvas:#10211f; --surface:#18312e; --raised:#25423c; --ink:#f1e8d6; --muted:#b5c6c0; --line:#58716a; --accent:#d8bb74; font-family:Georgia,"Noto Serif SC",serif; color:var(--ink); background:var(--canvas); }
    :root[data-theme="paper"] { --canvas:#f2eee5; --surface:#fbf8f1; --raised:#dbe9df; --ink:#1e312b; --muted:#4e6057; --line:#71877a; --accent:#2d6b59; }
    :root[data-theme="amber"] { --canvas:#281d16; --surface:#3a291d; --raised:#593d29; --ink:#fff1d9; --muted:#ddc6a8; --line:#96704b; --accent:#e0a54b; }
    *{box-sizing:border-box} body{margin:0;min-width:320px}.shell{width:min(1120px,calc(100% - 40px));margin:auto;padding:26px 0 80px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px;font:12px ui-monospace,monospace}.brand{font:700 21px Georgia}.brand span,.eyebrow{color:var(--accent)}.tabs{display:flex;gap:4px;padding:3px;border:1px solid var(--line)}button{border:0;background:transparent;color:inherit;padding:8px 11px;cursor:pointer;font:inherit}.tabs button.active,.nav button.active{background:var(--raised);outline:1px solid var(--accent)}.hero{padding:42px 0 28px}.eyebrow{margin:0 0 12px;font:11px ui-monospace,monospace;letter-spacing:.12em}.hero h1{max-width:720px;margin:0;font-size:clamp(43px,6vw,70px);line-height:1.06;letter-spacing:-.06em}.hero p:last-child{max-width:580px;color:var(--muted);line-height:1.7}.grid{display:grid;grid-template-columns:300px 1fr;gap:24px}.nav,.panel{border:1px solid var(--line);background:var(--surface)}.nav{display:grid;align-content:start;gap:7px;padding:10px}.nav button{text-align:left;padding:14px}.nav b,.nav small{display:block}.nav small{margin-top:4px;color:var(--muted);font:10px ui-monospace,monospace}.panel{min-height:430px;padding:42px;box-shadow:13px 13px 0 rgba(0,0,0,.22)}.panel h2{margin:0;font-size:39px;letter-spacing:-.04em}.intro{color:var(--muted);line-height:1.7}.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:28px 0}.facts div,.profile{background:var(--canvas);padding:14px}.facts small,.profile small,.profile code{display:block;color:var(--muted);font:11px ui-monospace,monospace}.facts b{display:block;margin-top:8px;color:var(--accent)}.action{border:1px solid var(--line);color:var(--accent)}.profiles{display:grid;gap:8px}.profile{border:1px solid var(--line)}.profile .result{margin-top:10px;color:#7cc9a5}.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.theme{min-height:160px;border:1px solid var(--line);background:var(--canvas);text-align:left}.theme b,.theme small,.theme span{display:block}.theme small{margin-top:9px;color:var(--muted);line-height:1.5}.theme span{margin-top:22px;color:var(--accent);font:10px ui-monospace,monospace}.callout{padding:15px;border-left:3px solid var(--accent);background:var(--canvas);color:var(--muted);line-height:1.6}@media(max-width:720px){.shell{width:min(100% - 28px,1120px)}.top{gap:14px}.grid{grid-template-columns:1fr}.nav{grid-template-columns:1fr 1fr}.panel{min-height:0;padding:24px;box-shadow:8px 8px 0 rgba(0,0,0,.22)}.theme-grid,.facts{grid-template-columns:1fr}.hero h1{font-size:52px}}
  </style>
</head>
<body><main class="shell">
  <header class="top"><div class="brand">DZMM <span>Next</span></div><div class="tabs"><button>世界</button><button class="active">设置</button></div><div>● 桌面 Host 已就绪</div></header>
  <section class="hero"><p class="eyebrow">LOCAL CONTROL ROOM</p><h1>设置应该告诉你：<br>现在能做什么。</h1><p>连接、模型、手机联动和外观各自独立；不会在创作或游玩时打断你。</p></section>
  <div class="grid"><nav class="nav" aria-label="设置分类"><button class="active" data-panel="host"><b>连接与安全</b><small>Host、诊断与恢复</small></button><button data-panel="models"><b>本地模型</b><small>完整协议档案</small></button><button data-panel="mobile"><b>手机联动</b><small>局域网、扫码与授权</small></button><button data-panel="appearance"><b>外观</b><small>适配故事的主题</small></button></nav>
  <section class="panel" id="panel"></section></div>
</main><script>
const views={host:`<p class="eyebrow">连接与安全</p><h2>这台 Mac 是唯一 Host</h2><p class="intro">数据库、Python 规则裁判和模型调用都只留在这台电脑。手机只获得获批的远程能力。</p><div class="facts"><div><small>当前状态</small><b>已就绪</b></div><div><small>数据模式</small><b>本地隔离</b></div></div><button class="action">导出不含隐私内容的诊断</button>`,models:`<p class="eyebrow">本地模型</p><h2>一个模型档案，<br>包含完整连接方式</h2><p class="intro">协议、Base URL 和模型名始终一起保存，避免把 LM Studio 当作 Ollama 调用。</p><div class="profiles"><article class="profile"><b>Ollama 7B UX</b><small>ollama · qwen2.5:7b</small><code>http://127.0.0.1:11434</code><button class="action">由 Host 探测</button><small class="result">可用 · protocol response contains content</small></article></div>`,mobile:`<p class="eyebrow">手机联动</p><h2>先开启局域网，<br>再批准具体手机</h2><p class="intro">二维码不包含 token；手机仍必须由你在这里批准。关闭局域网后，仅本机可访问 Host。</p><div class="callout">局域网开关仅在 Mac / Windows 桌面应用内可用；浏览器预览不会开放网络服务。</div>`,appearance:`<p class="eyebrow">外观</p><h2>让界面适合<br>正在发生的故事</h2><p class="intro">主题只改变这台电脑的视觉氛围，不改变世界、角色、Run 或任何规则状态。</p><div class="theme-grid"><button class="theme" data-theme="fog"><b>雾夜</b><small>深海绿与旧金色，适合夜间剧情</small><span>切换主题</span></button><button class="theme" data-theme="paper"><b>纸页</b><small>暖白与松绿，适合创作和阅读</small><span>切换主题</span></button><button class="theme" data-theme="amber"><b>琥珀</b><small>深棕与金色，适合悬疑与遗迹</small><span>切换主题</span></button></div>`};
const panel=document.querySelector('#panel');function select(key){panel.innerHTML=views[key];document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.panel===key));panel.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>document.documentElement.dataset.theme=b.dataset.theme)}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>select(b.dataset.panel));select('host');
</script></body></html>
